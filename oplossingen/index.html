<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Voorbeelden voor {bedrijf}, Sitefront</title>
<link rel="stylesheet" href="demo.css">
<script src="demo.js"></script>
</head>
<body data-naam="de voorbeelden">
<main>
  <section class="hero">
    <div class="wrap" style="grid-template-columns:1fr;grid-template-areas:'tekst'">
      <div class="hero-text" style="max-width:44rem">
        <h1 data-vul="Geen aanvraag of klant meer kwijt voor {bedrijf}"></h1>
        <p class="lead">Dit zijn de systemen die Sitefront voor jullie kan inrichten en onderhouden. Elk voorbeeld kun je zelf uitproberen.</p>
      </div>
    </div>
  </section>
  <section class="sec" style="border-top:0;padding-top:0">
    <div class="wrap">
      <ul class="list" id="lijst"></ul>
    </div>
  </section>
  <section data-cta></section>
</main>
<script>
(function () {
  const D = Demo;
  const items = [
    ["aanvragen", "Direct reageren op elke aanvraag", "Elke nieuwe aanvraag krijgt binnen een minuut een persoonlijk WhatsApp-bericht, met een link om meteen een afspraak te plannen."],
    ["offertes", "Offertes automatisch opvolgen", "Verstuurde offertes worden vriendelijk opgevolgd. Jullie bellen alleen nog klanten die gereageerd hebben."],
    ["assistent", "WhatsApp-assistent", "Standaardvragen worden direct beantwoord, ook 's avonds. Prijzen en lastige vragen gaan naar jullie."],
    ["reviews", "Meer reviews", "Na elke klus vanzelf een reviewverzoek. Ontevreden klanten komen eerst bij jullie uit."],
    ["offertetool", "Offertetool op de website", "Bezoekers geven stap voor stap hun wensen en maten door. Jullie krijgen een complete aanvraag binnen."]
  ];
  const ul = document.getElementById("lijst");
  items.forEach(([slug, titel, tekst]) => {
    const li = document.createElement("li");
    li.innerHTML = '<a><h3></h3><p></p><span class="go">Bekijk</span></a>';
    li.querySelector("a").href = slug + "/" + D.params();
    li.querySelector("h3").textContent = titel;
    li.querySelector("p").textContent = tekst;
    ul.appendChild(li);
  });
})();
</script>
</body>
</html>
